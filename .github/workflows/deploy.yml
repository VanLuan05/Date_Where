# ──────────────────────────────────────────────────────────────────────────────
# DateWhere — GitHub Pages Auto-Deploy Workflow
# ──────────────────────────────────────────────────────────────────────────────
# Kích hoạt: mỗi lần push lên nhánh `main`
# Kết quả  : build Vite → deploy thư mục dist lên GitHub Pages
#
# Để kích hoạt Firebase trong bản deploy:
#   GitHub repo → Settings → Secrets and variables → Actions
#   Tạo các Repository secrets sau (tên phải khớp chính xác):
#     VITE_FIREBASE_API_KEY
#     VITE_FIREBASE_AUTH_DOMAIN
#     VITE_FIREBASE_PROJECT_ID
#     VITE_FIREBASE_STORAGE_BUCKET
#     VITE_FIREBASE_MESSAGING_SENDER_ID
#     VITE_FIREBASE_APP_ID
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

# Phân quyền tối thiểu cần thiết cho GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có 1 deployment chạy cùng lúc
# Deployment đang chạy sẽ không bị cancel, chỉ queue bị bỏ qua
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Build ────────────────────────────────────────────────────────────
  build:
    name: Build Vite App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDyw5IMGaC-4QvTYa7tvZGmzGGMQnhE3UE"
          VITE_FIREBASE_AUTH_DOMAIN: "date-where.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "date-where"
          VITE_FIREBASE_STORAGE_BUCKET: "date-where.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "781250852250"
          VITE_FIREBASE_APP_ID: "1:781250852250:web:bd4254bb14d622260bb623"
        run: npm run build

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # ── Job 2: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
